name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { php: ["8.2", "8.3", "8.4"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", coverage: none }
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer stan
  generated-up-to-date:
    # src/Generated must be exactly what scripts/generate.sh produces from openapi.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: scripts/generate.sh
      - run: git status --porcelain && git diff --exit-code
